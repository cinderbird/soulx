<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aim Reticle — Unstable Recognition Input</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="banner" class="banner hidden"></div>
    <aside id="panel" class="panel"></aside>
    <section id="legend" class="legend">
      <h2>화면 보는 법</h2>
      <ul>
        <li><span class="dot aim"></span>파란 조준점 — 프로그램이 <b>최종 판단한</b> 손 위치</li>
        <li><span class="dot raw"></span>옅은 파란 점 — 카메라가 <b>방금 본 그대로</b>의 위치(흔들림 포함)</li>
        <li><span class="dot tail"></span>옅은 꼬리 — 조준점이 지나온 길</li>
        <li><span class="dot decoy"></span>빨간 점 — 카메라가 <b>잘못 인식한 곳</b>(일부러 무시하는 중)</li>
      </ul>
      <p class="legend-note">파란 점은 마구 떨리는데 조준점은 부드럽게 움직이면, 보정이 잘 되고 있다는 뜻입니다.</p>
    </section>
    <section id="hud" class="hud">
      <canvas id="hud-canvas" width="560" height="200"></canvas>
      <div id="hud-readout" class="hud-readout"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
